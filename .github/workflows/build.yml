name: Construir Bitty (Windows / macOS / Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Empaquetar
        run: python build.py

      - name: Comprimir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'dist\Bitty\*' -DestinationPath 'Bitty-Windows.zip'

      - name: Comprimir (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../Bitty-macOS.zip Bitty.app

      - name: Comprimir (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r ../Bitty-Linux.zip Bitty

      - uses: actions/upload-artifact@v4
        with:
          name: Bitty-${{ runner.os }}
          path: Bitty-*.zip
          if-no-files-found: error

  release:
    name: Publicar release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Crear release con los tres paquetes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Bitty ${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/Bitty-*.zip
