name: Construir Bitty (Windows / macOS / Linux / Fedora)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Alpha tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Alpha tests de la mascota
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Alpha tests del plugin
        run: |
          cd plugin
          npm ci
          npm run test:alpha
          npm run typecheck

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Empaquetar
        run: python build.py

      - name: Comprimir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'dist\Bitty\*' -DestinationPath 'Bitty-Windows.zip'

      - name: Comprimir (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../Bitty-macOS.zip Bitty.app

      - name: Comprimir (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r ../Bitty-Linux.zip Bitty

      - uses: actions/upload-artifact@v4
        with:
          name: Bitty-${{ runner.os }}
          path: Bitty-*.zip
          if-no-files-found: error

  fedora:
    name: Fedora (contenedor)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Dependencias del sistema
        run: |
          dnf install -y git ca-certificates python3 python3-devel python3-pip zip \
            gcc gcc-c++ binutils kernel-headers \
            xorg-x11-server-Xvfb xcb-util-cursor \
            mesa-libGL mesa-libEGL libxcb libX11 libXext libXrandr \
            libXrender libxkbcommon dbus-libs alsa-lib systemd-libs

      - uses: actions/checkout@v4

      - name: Entorno de Python
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pyinstaller

      - name: Empaquetar en Fedora
        run: .venv/bin/python build.py

      - name: Probar arranque real en Fedora (Xvfb)
        run: |
          code=0
          timeout 20s xvfb-run -a dist/Bitty/Bitty > bitty-smoke.log 2>&1 || code=$?
          cat bitty-smoke.log || true
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "Bitty salió con código $code"
            exit 1
          fi
          echo "Bitty arrancó en Fedora (código de timeout=$code)"

      - name: Comprimir paquete Fedora
        run: |
          mkdir -p package/Bitty package/agent
          cp -R dist/Bitty/. package/Bitty/
          cp agent/bitty.md package/agent/bitty.md
          cp install-fedora.sh package/
          cd package
          zip -r ../Bitty-Fedora.zip Bitty agent install-fedora.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Bitty-Fedora
          path: Bitty-Fedora.zip
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [build, fedora, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Crear release con los cuatro paquetes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Bitty ${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/Bitty-*.zip
